    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    # 10 Hz: at 20 the loop missed its rate constantly on the Jetson with
    # nvblox+YOLO+VSLAM sharing the SoC; 10 Hz is plenty at 0.26 m/s.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.05  # holonomic: allow small strafe velocities through
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # required_movement_radius was 0.5, which made ANY goal shorter than 0.5 m
      # impossible to satisfy — the checker aborted the action as "stuck" before
      # the robot ever reached the goal. 0.25 m within 15 s still catches a truly
      # wedged robot but lets short approach hops complete.
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    
    # RotationShim wrapping DWB: DWB with min_vel_x=0 (forward-only — the
    # camera must face travel) cannot reach a goal behind the robot; it stalls
    # and aborts "Failed to make progress" (observed on the first return goal
    # 2026-07-03). The shim rotates in place toward the path heading first
    # (exactly the validated turn-then-glide motion pattern), then hands off
    # to DWB. Rotation speed matches the yaw-safe 0.4 rad/s.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.5    # rad (~29deg): beyond this, rotate first
      forward_sampling_distance: 0.4
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      debug_trajectory_details: True
      # Holonomic mecanum: strafing enabled (max/min_vel_y) so the planner can
      # move sideways/diagonally instead of pivoting. Rotation is capped hard
      # (max_vel_theta + gentle accel) because a sustained in-place pivot stalls
      # all four wheels against each other and browns out the I2C motor driver.
      # 0.4 rad/s is the validated safe yaw (0.6 bricked the 0x34 board;
      # 23 consecutive turns clean at 0.4 — see motor memory 2026-07-02).
      min_vel_x: 0.0
      min_vel_y: -0.22
      max_vel_x: 0.26
      max_vel_y: 0.22
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 2.5
      acc_lim_theta: 1.5
      decel_lim_x: -2.5
      decel_lim_y: -2.5
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 10
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      # Lower heading-alignment weight: with strafing enabled the robot no longer
      # needs to rotate to face its travel direction, so don't reward it for doing
      # so (that was a big driver of the pivoting). Translation critics dominate.
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      # Local costmap runs in the MAP frame (not odom). NvbloxCostmapLayer
      # requires the transform from the costmap frame to the nvblox map frame
      # to be planar (2D); cuVSLAM's map->odom is full 6DOF (small z/roll/pitch)
      # and was rejected ("must be 2d, but it is 3d"), leaving the local costmap
      # empty. With global_frame=map the slice transform is identity, so it is
      # trivially planar. Tradeoff: loop-closure jumps in map are not smoothed by
      # an odom frame here — acceptable for now; revisit with planar odometry.
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # cuVSLAM stamps its TF on the (latent) camera clock — measured ~115ms
      # behind wall time — so a tight tolerance causes "extrapolation into the
      # future" lookup failures. 0.3s absorbs that latency.
      transform_tolerance: 0.3
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["nvblox_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # nvblox publishes a 2D ESDF distance slice (esdf_2d + distance_slice in the
      # nvblox node params); the NvbloxCostmapLayer reads it directly instead of
      # raytracing a PointCloud2 through a VoxelLayer.
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        # Must match this costmap's global_frame (now map → identity transform)
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True
        max_obstacle_distance: 1.0
        inflation_distance: 0.55
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      transform_tolerance: 0.3  # absorb cuVSLAM TF latency (see local_costmap)
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      # No pre-saved static map: nvblox is built live as the robot explores, so
      # the global costmap rolls with the robot (a fixed-origin grid left the
      # robot "out of bounds of the costmap" and planning always failed). 10x10m
      # gives planning headroom around the robot.
      rolling_window: true
      width: 10
      height: 10
      # Live nvblox reconstruction only — no pre-saved static map, so the
      # StaticLayer is dropped and the nvblox ESDF slice provides obstacles.
      plugins: ["nvblox_layer", "inflation_layer"]
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        # Must match this costmap's global_frame (per NVIDIA's reference config)
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True
        max_obstacle_distance: 1.0
        inflation_distance: 0.55
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # This Nav2 build registers behavior plugins with the slash-form pluginlib
    # names (nav2_behaviors/Spin), not the C++ "::" form — using "::" makes
    # behavior_server fail to load and aborts the whole Nav2 lifecycle bringup.
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    # MUST match the local costmap's frame (map): the spin/backup behaviors
    # collision-check against the local costmap, and with mismatched frames
    # every spin died with "Pose Goes Off Grid" (observed 2026-07-03).
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3  # absorb cuVSLAM TF latency (see local_costmap)
    use_sim_time: false
    simulate_ahead_time: 2.0
    # In-place Spin recovery is the worst case for the I2C driver (sustained
    # full-speed pivot stalls all 4 wheels and browns it out), so cap it to match
    # the controller's max_vel_theta (0.4 = validated safe; 0.6 bricked the board).
    max_rotational_vel: 0.4
    min_rotational_vel: 0.3
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Y (strafe) MUST be enabled here to match DWB's max_vel_y (±0.22). Previously
    # this was clamped to 0 while DWB still commanded sideways velocity, so every
    # strafe command was zeroed mid-stream — the robot got contradictory cmd_vel
    # (DWB says crab, smoother says don't) and jerked/oscillated. That oscillation
    # is what threw cuVSLAM's visual odometry into a multi-metre XY teleport. With
    # y enabled the holonomic command passes through cleanly and the base crabs
    # smoothly instead of pivoting (pivoting browns out the I2C driver — see the
    # FollowPath comment and memory motor-driver-i2c-contention-kills-board).
    # theta clamp 0.4: the smoother is the LAST gate before /cmd_vel reaches
    # the motor node; 0.6+ rad/s pivots brick the 0x34 driver.
    max_velocity: [0.26, 0.22, 0.4]
    min_velocity: [-0.26, -0.22, -0.4]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "/visual_slam/tracking/odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
