services:
  vision:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vision_production:1.0
    runtime: nvidia
    privileged: true
    network_mode: host
    ipc: host
    restart: always
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "8765:8765"  # legacy websocket (unused by default)
      - "8080:8080"  # web viewer
      - "9090:9090"  # rosbridge websocket (exposed to host)
    environment:
      
      
      
      CAM_W: "640"
      CAM_H: "480"
      NET_W: "640"
      NET_H: "640"
      MODEL_FILE_PATH: "/models/clothes2.onnx"
      ENGINE_FILE_PATH: "/models/clothes2.plan"
      CONF_TH: "0.65"
      NMS_TH: "0.45"
      NUM_CLASSES: "1"
      CAMERA_ONLY: "false"
      ENABLE_SLAM: "true"
      ENABLE_YOLO: "false"
      ALIGN_DEPTH: "false"
      ENABLE_DEPTH: "false"
      ENABLE_COLOR: "false"
      ENABLE_ARM: "false"
      ENABLE_IMU: "true"
      CAMERA_FPS: "90"
      ENABLE_BEHAVIOR: "false"
      ENABLE_NAV2: "false"
      ENABLE_NVBLOX: "false"
      ENABLE_VISUALIZATION: "true"
      # CYCLONEDDS_URI: /root/.cyclonedds.xml
      # RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      # ROS_DOMAIN_ID: 0
      ROS_DOMAIN_ID: 0
      ROS_LOCALHOST_ONLY: 1  # Confine ROS to localhost (no cross-machine discovery)
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/i2c-7:/dev/i2c-7
      - ../src:/opt/vision_ws/src
      - ../tests:/opt/vision_ws/tests
      - slam_data:/tmp/cuvslam
      - /dev:/dev
          devices:
      - /dev/bus/usb
      - /dev/i2c-7

volumes:
  slam_data:
