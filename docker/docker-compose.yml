services:
  vision:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vision_production:1.0
    # Run the BIND-MOUNTED entrypoint, not the one COPY'd into the image at
    # build time. Without this, editing scripts/entrypoint.sh silently does
    # nothing until the image is rebuilt — the stale baked copy keeps running,
    # which is exactly how a new launch argument can go missing (2026-07-22).
    entrypoint: ["/scripts/entrypoint.sh"]
    runtime: nvidia
    privileged: true
    network_mode: host
    ipc: host
    restart: always
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "8765:8765"  # legacy websocket (unused by default)
      - "8080:8080"  # web viewer
      - "9090:9090"  # rosbridge websocket (exposed to host)
    environment:

      
      
      
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      CAM_W: "640"
      CAM_H: "480"
      NET_W: "640"
      NET_H: "640"
      MODEL_FILE_PATH: "/models/socks2.onnx"
      ENGINE_FILE_PATH: "/models/socks2.plan"
      CONF_TH: "0.25"
      NMS_TH: "0.5"
      NUM_CLASSES: "1"
      CAMERA_ONLY: "false"
      # TELEOP RIG (2026-07-22): the operator drives base + arm from the web UI
      # via robot_teleop, which owns /dev/ttyUSB0 exclusively.
      #   ENABLE_ARM=false   arm_bridge would fight teleop for the serial port,
      #                      and it respawns, so killing it is not enough.
      #   ENABLE_NAV2=false  the Nav2 servers publish /cmd_vel autonomously and
      #                      would fight the operator. ENABLE_TELEOP still
      #                      brings up motor_controller on its own.
      #   ENABLE_BEHAVIOR=false  the mission state machine also sends goals.
      # SLAM / YOLO / nvblox stay off to free the GPU; teleop consumes only the
      # color stream. Flip these back for autonomous missions.
      ENABLE_TELEOP: "true"
      # on-device socks2 on both cameras + wrist raw republish
      # (head_scout fusion, robot pick --wrist-detector yolo)
      ENABLE_WRIST_YOLO: "true"
      ENABLE_SLAM: "false"
      ENABLE_YOLO: "false"
      ALIGN_DEPTH: "true"
      ENABLE_DEPTH: "true"
      ENABLE_COLOR: "true"
      ENABLE_ARM: "false"
      ENABLE_IMU: "true"
      CAMERA_FPS: "30"
      ENABLE_BEHAVIOR: "false"
      ENABLE_NAV2: "false"
      ENABLE_NVBLOX: "false"
      ENABLE_VISUALIZATION: "true"
      # CYCLONEDDS_URI: /root/.cyclonedds.xml
      # RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      # ROS_DOMAIN_ID: 0
      ROS_DOMAIN_ID: 0
      ROS_LOCALHOST_ONLY: 1  # Confine ROS to localhost (no cross-machine discovery)
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/vision_ws/fastdds.xml
    volumes:
      - ./fastdds_jetson.xml:/opt/vision_ws/fastdds.xml:ro
      - /dev/bus/usb:/dev/bus/usb
      - /dev/i2c-7:/dev/i2c-7
      - ../src:/opt/vision_ws/src
      - ../tests:/opt/vision_ws/tests
      - ../ui:/opt/vision_ws/ui:ro  # operator console (served by http.server on 8080)
      - ../models:/models
      - ../scripts:/scripts:ro
      - ../demos:/demos   # pi0.5 demonstration episodes (gitignored)
      - slam_data:/tmp/cuvslam
      - /dev:/dev
    devices:
      - /dev/bus/usb
      - /dev/i2c-7

volumes:
  slam_data:
