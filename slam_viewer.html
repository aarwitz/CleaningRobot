<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual SLAM Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            z-index: 1000;
            border-bottom: 2px solid #00ff88;
        }
        
        h1 {
            margin: 0;
            font-size: 24px;
            color: #00ff88;
        }
        
        #status {
            margin-top: 5px;
            font-size: 14px;
            color: #aaa;
        }
        
        .connected { color: #00ff88; }
        .disconnected { color: #ff4444; }
        
        #controls {
            position: fixed;
            top: 90px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 999;
            min-width: 250px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }
        
        .control-group input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .stat-label { color: #aaa; }
        .stat-value { color: #00ff88; font-weight: bold; }
        
        #container {
            position: fixed;
            top: 90px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        button {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        
        button:hover {
            background: #00dd77;
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🤖 Visual SLAM Viewer</h1>
        <div id="status" class="disconnected">Connecting to rosbridge...</div>
    </div>
    
    <div id="controls">
        <div class="control-group">
            <strong>Statistics</strong>
            <div class="stat">
                <span class="stat-label">SLAM State:</span>
                <span class="stat-value" id="vo-state">--</span>
            </div>
            <div class="stat">
                <span class="stat-label">Odometry:</span>
                <span class="stat-value" id="odom-rate">-- Hz</span>
            </div>
            <div class="stat">
                <span class="stat-label">Landmarks:</span>
                <span class="stat-value" id="landmarks-count">--</span>
            </div>
            <div class="stat">
                <span class="stat-label">Path Length:</span>
                <span class="stat-value" id="path-length">-- m</span>
            </div>
        </div>
        
        <div class="control-group">
            <strong>Display Options</strong>
            <label><input type="checkbox" id="show-path" checked> SLAM Path</label>
            <label><input type="checkbox" id="show-landmarks" checked> Landmarks</label>
            <label><input type="checkbox" id="show-odometry" checked> Odometry</label>
            <label><input type="checkbox" id="show-grid" checked> Grid</label>
            <label><input type="checkbox" id="auto-follow"> Auto-Follow Robot</label>
        </div>
        
        <div class="control-group">
            <button id="reset-view">Reset View</button>
            <button id="clear-path">Clear Path</button>
        </div>
    </div>
    
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <script>
        // Simple OrbitControls fallback if CDN fails
        if (typeof THREE.OrbitControls === 'undefined') {
            THREE.OrbitControls = function(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;
                this.target = new THREE.Vector3();
                this.enableDamping = true;
                this.dampingFactor = 0.05;
                
                let isMouseDown = false;
                let mouseButton = 0;
                const rotateSpeed = 0.005;
                const panSpeed = 0.01;
                const zoomSpeed = 0.1;
                
                const spherical = { radius: 10, theta: 0, phi: Math.PI / 4 };
                
                const updateCamera = () => {
                    const pos = new THREE.Vector3();
                    pos.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
                    pos.y = spherical.radius * Math.cos(spherical.phi);
                    pos.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
                    this.camera.position.copy(this.target).add(pos);
                    this.camera.lookAt(this.target);
                };
                
                domElement.addEventListener('mousedown', (e) => {
                    isMouseDown = true;
                    mouseButton = e.button;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                });
                
                domElement.addEventListener('mousemove', (e) => {
                    if (!isMouseDown) return;
                    const dx = e.clientX - this.lastX;
                    const dy = e.clientY - this.lastY;
                    
                    if (mouseButton === 0) { // Left button - rotate
                        spherical.theta += dx * rotateSpeed;
                        spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + dy * rotateSpeed));
                    } else if (mouseButton === 2) { // Right button - pan
                        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(this.camera.quaternion);
                        const up = new THREE.Vector3(0, 1, 0).applyQuaternion(this.camera.quaternion);
                        this.target.add(right.multiplyScalar(-dx * panSpeed));
                        this.target.add(up.multiplyScalar(dy * panSpeed));
                    }
                    
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                    updateCamera();
                });
                
                domElement.addEventListener('mouseup', () => { isMouseDown = false; });
                domElement.addEventListener('contextmenu', (e) => e.preventDefault());
                
                domElement.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    spherical.radius = Math.max(1, Math.min(100, spherical.radius + e.deltaY * zoomSpeed * 0.01));
                    updateCamera();
                });
                
                this.update = () => {}; // No-op for compatibility
                
                // Initialize position
                const offset = this.camera.position.clone().sub(this.target);
                spherical.radius = offset.length();
                spherical.theta = Math.atan2(offset.x, offset.z);
                spherical.phi = Math.acos(Math.max(-1, Math.min(1, offset.y / spherical.radius)));
            };
        }
        
        // ROS connection
        const ros = new ROSLIB.Ros({
            url: `ws://${window.location.hostname}:9090`
        });
        
        const statusEl = document.getElementById('status');
        
        ros.on('connection', () => {
            statusEl.textContent = 'Connected to rosbridge';
            statusEl.className = 'connected';
        });
        
        ros.on('error', (error) => {
            statusEl.textContent = 'Error: ' + error;
            statusEl.className = 'disconnected';
        });
        
        ros.on('close', () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'disconnected';
        });
        
        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / (window.innerHeight - 90),
            0.1,
            1000
        );
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight - 90);
        document.getElementById('container').appendChild(renderer.domElement);
        
        // Orbit controls for smooth 3D navigation
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 1;
        controls.maxDistance = 100;
        controls.maxPolarAngle = Math.PI / 2;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);
        
        // Grid
        const gridHelper = new THREE.GridHelper(20, 20, 0x00ff88, 0x444444);
        scene.add(gridHelper);
        
        // SLAM path
        const pathGeometry = new THREE.BufferGeometry();
        const pathMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88, linewidth: 2 });
        const pathLine = new THREE.Line(pathGeometry, pathMaterial);
        scene.add(pathLine);
        const pathPoints = [];
        
        // Landmarks (point cloud)
        const landmarksGeometry = new THREE.BufferGeometry();
        const landmarksMaterial = new THREE.PointsMaterial({ 
            color: 0xff8800, 
            size: 0.05,
            sizeAttenuation: true
        });
        const landmarksPoints = new THREE.Points(landmarksGeometry, landmarksMaterial);
        scene.add(landmarksPoints);
        
        // Odometry marker (robot pose)
        const robotGeometry = new THREE.ConeGeometry(0.2, 0.5, 8);
        const robotMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff88 });
        const robot = new THREE.Mesh(robotGeometry, robotMaterial);
        robot.rotation.x = Math.PI / 2;
        scene.add(robot);
        
        // ROS subscribers
        let odomCount = 0;
        let lastOdomTime = Date.now();
        let autoFollow = false;
        let lastRobotPos = new THREE.Vector3();
        
        const statusSub = new ROSLIB.Topic({
            ros: ros,
            name: '/visual_slam/status',
            messageType: 'isaac_ros_visual_slam_interfaces/msg/VisualSlamStatus'
        });
        
        statusSub.subscribe((message) => {
            const states = ['NOT_READY', 'VISUAL_ONLY', 'TRACKING'];
            document.getElementById('vo-state').textContent = states[message.vo_state] || 'UNKNOWN';
        });
        
        const odomSub = new ROSLIB.Topic({
            ros: ros,
            name: '/visual_slam/tracking/odometry',
            messageType: 'nav_msgs/msg/Odometry'
        });
        
        odomSub.subscribe((message) => {
            const pos = message.pose.pose.position;
            const quat = message.pose.pose.orientation;
            
            robot.position.set(pos.x, pos.z, -pos.y);
            robot.quaternion.set(quat.x, quat.z, -quat.y, quat.w);
            
            lastRobotPos.set(pos.x, pos.z, -pos.y);
            
            // Update rate
            odomCount++;
            const now = Date.now();
            if (now - lastOdomTime > 1000) {
                document.getElementById('odom-rate').textContent = odomCount.toFixed(1);
                odomCount = 0;
                lastOdomTime = now;
            }
            
            // Auto-follow camera (if enabled)
            if (autoFollow) {
                controls.target.copy(lastRobotPos);
                const offset = new THREE.Vector3(5, 5, 10);
                camera.position.copy(lastRobotPos).add(offset);
            }
        });
        
        const pathSub = new ROSLIB.Topic({
            ros: ros,
            name: '/visual_slam/tracking/slam_path',
            messageType: 'nav_msgs/msg/Path'
        });
        
        pathSub.subscribe((message) => {
            pathPoints.length = 0;
            let totalDist = 0;
            
            for (let i = 0; i < message.poses.length; i++) {
                const p = message.poses[i].pose.position;
                pathPoints.push(new THREE.Vector3(p.x, p.z, -p.y));
                
                if (i > 0) {
                    totalDist += pathPoints[i].distanceTo(pathPoints[i-1]);
                }
            }
            
            pathGeometry.setFromPoints(pathPoints);
            pathGeometry.attributes.position.needsUpdate = true;
            
            document.getElementById('path-length').textContent = totalDist.toFixed(2);
        });
        
        const landmarksSub = new ROSLIB.Topic({
            ros: ros,
            name: '/visual_slam/vis/landmarks_cloud',
            messageType: 'sensor_msgs/msg/PointCloud2'
        });
        
        landmarksSub.subscribe((message) => {
            // Parse PointCloud2 (simplified - assumes XYZ float32)
            const view = new DataView(new Uint8Array(message.data).buffer);
            const pointStep = message.point_step;
            const numPoints = message.width * message.height;
            
            const positions = new Float32Array(numPoints * 3);
            
            for (let i = 0; i < numPoints; i++) {
                const offset = i * pointStep;
                const x = view.getFloat32(offset, true);
                const y = view.getFloat32(offset + 4, true);
                const z = view.getFloat32(offset + 8, true);
                
                positions[i * 3] = x;
                positions[i * 3 + 1] = z;
                positions[i * 3 + 2] = -y;
            }
            
            landmarksGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            landmarksGeometry.attributes.position.needsUpdate = true;
            
            document.getElementById('landmarks-count').textContent = numPoints;
        });
        
        // Controls
        document.getElementById('show-path').addEventListener('change', (e) => {
            pathLine.visible = e.target.checked;
        });
        
        document.getElementById('show-landmarks').addEventListener('change', (e) => {
            landmarksPoints.visible = e.target.checked;
        });
        
        document.getElementById('show-odometry').addEventListener('change', (e) => {
            robot.visible = e.target.checked;
        });
        
        document.getElementById('show-grid').addEventListener('change', (e) => {
            gridHelper.visible = e.target.checked;
        });
        
        document.getElementById('auto-follow').addEventListener('change', (e) => {
            autoFollow = e.target.checked;
        });
        
        document.getElementById('reset-view').addEventListener('click', () => {
            camera.position.set(0, 5, 10);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        document.getElementById('clear-path').addEventListener('click', () => {
            pathPoints.length = 0;
            pathGeometry.setFromPoints(pathPoints);
            pathGeometry.attributes.position.needsUpdate = true;
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Required for damping
            renderer.render(scene, camera);
        }
        animate();
        
        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 90);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 90);
        });
    </script>
</body>
</html>
